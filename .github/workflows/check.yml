name: Vérifier le site de veille

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compiler et vérifier
        run: |
          python3 scripts/build.py
          python3 scripts/check.py
          python3 scripts/test-editions.py
          node --check assets/app.js
          node scripts/test-interactions.cjs
          node scripts/test-featured-source.cjs
          node --check assets/perspectives.js
          node scripts/test-perspectives.cjs
